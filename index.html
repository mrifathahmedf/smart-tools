<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Tools — আপনার টুল হাব</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --text:#1f2540; --muted:#6b7390;
  --brand1:#6366f1; --brand2:#ec4899; --brand3:#06b6d4;
  --card:#ffffff; --border:#e6e9f5; --shadow:0 8px 30px rgba(60,70,160,.10);
  --side:#ffffff;
}
[data-theme="dark"]{
  --bg:#0e1117; --panel:#161b27; --text:#e8ecf7; --muted:#9aa3c0;
  --card:#1b2233; --border:#2a3350; --shadow:0 8px 30px rgba(0,0,0,.45);
  --side:#141a26;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Roboto,system-ui,'Noto Sans Bengali',sans-serif}
body{background:var(--bg);color:var(--text);transition:.3s}
.app{display:flex;min-height:100vh}

/* Sidebar */
.sidebar{width:260px;background:var(--side);border-right:1px solid var(--border);
  padding:20px 14px;display:flex;flex-direction:column;gap:8px;position:fixed;height:100vh;overflow-y:auto;transition:.3s;z-index:50}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:18px;padding:0 6px}
.logo .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand1),var(--brand2));display:grid;place-items:center;color:#fff;font-size:18px}
.gradtext{background:linear-gradient(135deg,var(--brand1),var(--brand2),var(--brand3));-webkit-background-clip:text;background-clip:text;color:transparent}
.cat-title{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:12px 8px 4px}
.cat{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--text);transition:.2s}
.cat:hover{background:linear-gradient(135deg,rgba(99,102,241,.12),rgba(236,72,153,.12))}
.cat.active{background:linear-gradient(135deg,var(--brand1),var(--brand2));color:#fff;box-shadow:var(--shadow)}
.cat .ic{font-size:18px}

/* Main */
.main{margin-left:260px;flex:1;padding:24px 30px;transition:.3s;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px;flex-wrap:wrap}
.menu-btn{display:none;background:var(--panel);border:1px solid var(--border);border-radius:10px;
  width:44px;height:44px;font-size:20px;cursor:pointer;color:var(--text)}
.heading h1{font-size:26px}
.heading p{color:var(--muted);font-size:14px;margin-top:2px}
.actions{display:flex;gap:10px}
.btn{border:none;cursor:pointer;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;transition:.2s;color:#fff;
  background:linear-gradient(135deg,var(--brand1),var(--brand2))}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.btn.icon{width:44px;height:44px;padding:0;font-size:18px;display:grid;place-items:center}

/* Search */
.search{position:relative;margin-bottom:22px}
.search input{width:100%;padding:14px 16px 14px 44px;border-radius:14px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);font-size:15px;outline:none}
.search .si{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;
  display:flex;flex-direction:column;gap:10px;transition:.25s;position:relative;overflow:hidden;text-decoration:none;color:inherit}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand1),var(--brand2),var(--brand3))}
.card:hover{transform:translateY(-5px);box-shadow:var(--shadow);border-color:var(--brand1)}
.card .ava{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:20px}
.card h3{font-size:16px}
.card p{font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.card .go{font-size:12px;font-weight:700;color:var(--brand1)}
.del{position:absolute;top:12px;right:12px;background:rgba(236,72,153,.12);color:var(--brand2);border:none;
  width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;opacity:0;transition:.2s}
.card:hover .del{opacity:1}

.loadwrap{display:flex;justify-content:center;margin:30px 0}
.empty{text-align:center;color:var(--muted);padding:60px 0}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,12,25,.55);backdrop-filter:blur(4px);display:none;
  place-items:center;z-index:100;padding:20px}
.overlay.open{display:grid}
.modal{background:var(--panel);border-radius:20px;padding:26px;width:100%;max-width:440px;box-shadow:var(--shadow);border:1px solid var(--border)}
.modal h2{margin-bottom:6px;font-size:20px}
.modal .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.field input,.field select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;outline:none}
.modal-actions{display:flex;gap:10px;margin-top:8px}
.modal-actions .btn{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid var(--border);border-radius:14px;margin-bottom:12px}
.switch{position:relative;width:52px;height:28px}
.switch input{display:none}
.slider{position:absolute;inset:0;background:var(--border);border-radius:30px;cursor:pointer;transition:.3s}
.slider::before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.switch input:checked+.slider{background:linear-gradient(135deg,var(--brand1),var(--brand2))}
.switch input:checked+.slider::before{transform:translateX(24px)}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:s 1s linear infinite;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
.backdrop{display:none}
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.show{transform:translateX(0)}
  .main{margin-left:0}
  .menu-btn{display:grid;place-items:center}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40}
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo"><span class="dot">⚡</span><span class="gradtext">Smart Tools</span></div>
    <div class="cat-title">ক্যাটাগরি</div>
    <div id="catList"></div>
    <button class="btn ghost" style="margin-top:14px" onclick="openCatModal()">+ নতুন ক্যাটাগরি</button>
  </aside>
  <div class="backdrop" id="backdrop" onclick="toggleSidebar()"></div>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="heading">
          <h1 id="catHeading" class="gradtext">AI Chat Tools</h1>
          <p id="catSub">আপনার সব এআই চ্যাট টুল এক জায়গায়</p>
        </div>
      </div>
      <div class="actions">
        <button class="btn" onclick="openToolModal()">+ টুল যোগ করুন</button>
        <button class="btn icon ghost" title="সেটিংস" onclick="openSettings()">⚙️</button>
      </div>
    </div>

    <div class="search">
      <span class="si">🔍</span>
      <input id="searchBox" placeholder="টুল খুঁজুন..." oninput="render()">
    </div>

    <div class="grid" id="grid"></div>
    <div class="loadwrap"><button class="btn" id="loadBtn" onclick="loadMore()">⬇️ Load More টুলস</button></div>
  </main>
</div>

<!-- Add Tool Modal -->
<div class="overlay" id="toolModal">
  <div class="modal">
    <h2>টুল যোগ করুন</h2>
    <p class="sub" id="toolModalSub">আপনার পছন্দের টুল এই ক্যাটাগরিতে যোগ করুন</p>
    <div class="field"><label>Tools name</label><input id="tName" placeholder="example"></div>
    <div class="field"><label>Link</label><input id="tLink" placeholder="https://tools-link-here.com"></div>
    <div class="field"><label>সংক্ষিপ্ত বর্ণনা (ঐচ্ছিক)</label><input id="tDesc" placeholder="এই টুলটি কী করে"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('toolModal')">বাতিল</button>
      <button class="btn" onclick="saveTool()">💾 Save Tool</button>
    </div>
  </div>
</div>

<!-- Category Modal -->
<div class="overlay" id="catModal">
  <div class="modal">
    <h2>নতুন ক্যাটাগরি</h2>
    <p class="sub">নতুন টুল ক্যাটাগরি তৈরি করুন</p>
    <div class="field"><label>ক্যাটাগরির নাম</label><input id="cName" placeholder="যেমন: Image Generator"></div>
    <div class="field"><label>আইকন (ইমোজি)</label><input id="cIcon" placeholder="🎨" maxlength="2"></div>
    <div class="modal-actions">
      <button class="btn ghost" onclick="closeModal('catModal')">বাতিল</button>
      <button class="btn" onclick="saveCat()">➕ যোগ করুন</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="settingsModal">
  <div class="modal">
    <h2>⚙️ সেটিংস</h2>
    <p class="sub">আপনার অভিজ্ঞতা কাস্টমাইজ করুন</p>
    <div class="toggle">
      <div><strong>🌙 ডার্ক নাইট মোড</strong><div style="font-size:12px;color:var(--muted)">চোখের আরামের জন্য ডার্ক থিম</div></div>
      <label class="switch"><input type="checkbox" id="darkToggle" onchange="toggleDark()"><span class="slider"></span></label>
    </div>
    <div class="modal-actions"><button class="btn" style="flex:1" onclick="closeModal('settingsModal')">বন্ধ করুন</button></div>
  </div>
</div>

<script>
/* ---------- Seed data: AI Chat tools (worldwide) ---------- */
var SEED = {
  "ai-chat": {
    name:"AI Chat Tools", icon:"💬", sub:"আপনার সব এআই চ্যাট টুল এক জায়গায়",
    batches:[
      [
        {n:"ChatGPT",l:"https://chat.openai.com",d:"OpenAI-এর জনপ্রিয় এআই চ্যাটবট",c:"#10a37f"},
        {n:"Claude",l:"https://claude.ai",d:"Anthropic-এর নিরাপদ ও স্মার্ট এআই",c:"#d97757"},
        {n:"Gemini",l:"https://gemini.google.com",d:"Google-এর মাল্টিমোডাল এআই",c:"#4285f4"},
        {n:"Perplexity",l:"https://www.perplexity.ai",d:"উত্তর সহ এআই সার্চ ইঞ্জিন",c:"#20808d"},
        {n:"Mistral / Le Chat",l:"https://chat.mistral.ai",d:"Mistral-এর ওপেন এআই চ্যাট",c:"#fa5310"},
        {n:"Qwen Chat",l:"https://chat.qwen.ai",d:"Alibaba-এর Qwen এআই চ্যাট",c:"#615ced"},
        {n:"Microsoft Copilot",l:"https://copilot.microsoft.com",d:"Microsoft-এর এআই সহকারী",c:"#0078d4"},
        {n:"DeepSeek",l:"https://chat.deepseek.com",d:"শক্তিশালী রিজনিং এআই চ্যাট",c:"#4d6bfe"}
      ],
      [
        {n:"Grok",l:"https://grok.com",d:"xAI-এর এআই চ্যাটবট",c:"#000000"},
        {n:"Meta AI",l:"https://www.meta.ai",d:"Meta-এর Llama ভিত্তিক এআই",c:"#0064e0"},
        {n:"Poe",l:"https://poe.com",d:"একাধিক এআই মডেল এক অ্যাপে",c:"#5d3fd3"},
        {n:"HuggingChat",l:"https://huggingface.co/chat",d:"Hugging Face-এর ওপেন চ্যাট",c:"#ff9d00"},
        {n:"Pi",l:"https://pi.ai",d:"Inflection-এর ব্যক্তিগত এআই",c:"#a06bf5"},
        {n:"Character.AI",l:"https://character.ai",d:"চরিত্রভিত্তিক এআই চ্যাট",c:"#3b5bfe"},
        {n:"You.com",l:"https://you.com",d:"এআই সার্চ ও চ্যাট",c:"#7c3aed"},
        {n:"Kimi (Moonshot)",l:"https://kimi.moonshot.cn",d:"লং-কনটেক্সট এআই চ্যাট",c:"#16a3ff"}
      ],
      [
        {n:"Ernie Bot",l:"https://yiyan.baidu.com",d:"Baidu-এর এআই চ্যাট",c:"#2932e1"},
        {n:"Doubao",l:"https://www.doubao.com",d:"ByteDance-এর এআই চ্যাট",c:"#0a84ff"},
        {n:"Clova X",l:"https://clova-x.naver.com",d:"Naver-এর কোরিয়ান এআই",c:"#03c75a"},
        {n:"Jasper Chat",l:"https://www.jasper.ai",d:"মার্কেটিং কেন্দ্রিক এআই চ্যাট",c:"#ff7a59"},
        {n:"Phind",l:"https://www.phind.com",d:"ডেভেলপারদের জন্য এআই চ্যাট",c:"#2563eb"},
        {n:"Komo AI",l:"https://komo.ai",d:"দ্রুত এআই সার্চ চ্যাট",c:"#ff5a5f"},
        {n:"Andi Search",l:"https://andisearch.com",d:"কথোপকথনমূলক এআই সার্চ",c:"#00b3a4"},
        {n:"GroqChat",l:"https://groq.com",d:"অতি দ্রুত এআই ইনফারেন্স চ্যাট",c:"#f55036"}
      ]
    ]
  }
};

var state = JSON.parse(localStorage.getItem("smartTools")||"null");
function defaultState(){
  var s={cats:{},order:[],active:"ai-chat",loaded:{}};
  for(var k in SEED){
    s.cats[k]={name:SEED[k].name,icon:SEED[k].icon,sub:SEED[k].sub,tools:SEED[k].batches[0].slice(),custom:[]};
    s.order.push(k); s.loaded[k]=1;
  }
  return s;
}
if(!state) state=defaultState();
function save(){localStorage.setItem("smartTools",JSON.stringify(state));}

/* ---------- Render ---------- */
function colorOf(t){return t.c||["#6366f1","#ec4899","#06b6d4","#f59e0b","#10b981","#8b5cf6"][(t.n.charCodeAt(0))%6];}
function renderCats(){
  var html="";
  state.order.forEach(function(k){
    var c=state.cats[k];
    html+='<div class="cat '+(k===state.active?'active':'')+'" onclick="selectCat(\''+k+'\')"><span class="ic">'+c.icon+'</span>'+c.name+'</div>';
  });
  document.getElementById("catList").innerHTML=html;
}
function selectCat(k){state.active=k;save();render();if(window.innerWidth<=860)toggleSidebar();}
function render(){
  renderCats();
  var c=state.cats[state.active];
  document.getElementById("catHeading").textContent=c.name;
  document.getElementById("catSub").textContent=c.sub||"আপনার পছন্দের টুলগুলো";
  var q=(document.getElementById("searchBox").value||"").toLowerCase();
  var all=c.tools.concat(c.custom||[]);
  var list=all.filter(function(t){return t.n.toLowerCase().indexOf(q)>-1||(t.d||"").toLowerCase().indexOf(q)>-1;});
  var g=document.getElementById("grid");
  if(list.length===0){g.innerHTML='<div class="empty" style="grid-column:1/-1">কোনো টুল পাওয়া যায়নি। উপরে "+ টুল যোগ করুন" বাটনে ক্লিক করুন।</div>';}
  else{
    g.innerHTML=list.map(function(t,i){
      var idx=all.indexOf(t);var isCustom=idx>=c.tools.length;
      var letter=t.n.charAt(0).toUpperCase();
      return '<a class="card" href="'+t.l+'" target="_blank" rel="noopener">'+
        (isCustom?'<button class="del" title="মুছুন" onclick="event.preventDefault();event.stopPropagation();delTool('+(idx-c.tools.length)+')">🗑</button>':'')+
        '<div class="ava" style="background:linear-gradient(135deg,'+colorOf(t)+',#ec4899)">'+letter+'</div>'+
        '<h3>'+t.n+'</h3><p>'+(t.d||"টুল লিংক")+'</p><span class="go">খুলুন ↗</span></a>';
    }).join("");
  }
  // load more visibility
  var hasMore = SEED[state.active] && state.loaded[state.active]<SEED[state.active].batches.length;
  document.getElementById("loadBtn").style.display = hasMore? "inline-flex":"none";
}

/* ---------- Load More ---------- */
function loadMore(){
  var k=state.active, btn=document.getElementById("loadBtn");
  if(!SEED[k])return;
  btn.innerHTML='<span class="spin"></span> ইন্টারনেটে খুঁজছি...';
  setTimeout(function(){
    var next=state.loaded[k];
    if(SEED[k].batches[next]){
      state.cats[k].tools=state.cats[k].tools.concat(SEED[k].batches[next]);
      state.loaded[k]=next+1; save();
    }
    btn.innerHTML='⬇️ Load More টুলস';
    render();
  },900);
}

/* ---------- Add Tool ---------- */
function openToolModal(){document.getElementById("toolModalSub").textContent="\""+state.cats[state.active].name+"\" ক্যাটাগরিতে টুল যোগ করুন";document.getElementById("toolModal").classList.add("open");}
function saveTool(){
  var n=document.getElementById("tName").value.trim();
  var l=document.getElementById("tLink").value.trim();
  var d=document.getElementById("tDesc").value.trim();
  if(!n||!l){alert("নাম ও লিংক দিন");return;}
  if(!/^https?:\/\//.test(l))l="https://"+l;
  state.cats[state.active].custom=state.cats[state.active].custom||[];
  state.cats[state.active].custom.push({n:n,l:l,d:d||"কাস্টম টুল"});
  save();closeModal('toolModal');
  document.getElementById("tName").value="";document.getElementById("tLink").value="";document.getElementById("tDesc").value="";
  render();
}
function delTool(i){if(confirm("টুলটি মুছবেন?")){state.cats[state.active].custom.splice(i,1);save();render();}}

/* ---------- Category ---------- */
function openCatModal(){document.getElementById("catModal").classList.add("open");}
function saveCat(){
  var n=document.getElementById("cName").value.trim();
  var ic=document.getElementById("cIcon").value.trim()||"📁";
  if(!n){alert("ক্যাটাগরির নাম দিন");return;}
  var key="cat-"+Date.now();
  state.cats[key]={name:n,icon:ic,sub:"আপনার কাস্টম ক্যাটাগরি",tools:[],custom:[]};
  state.order.push(key);state.active=key;save();
  document.getElementById("cName").value="";document.getElementById("cIcon").value="";
  closeModal('catModal');render();
}

/* ---------- Settings / Dark ---------- */
function openSettings(){document.getElementById("darkToggle").checked=document.documentElement.getAttribute("data-theme")==="dark";document.getElementById("settingsModal").classList.add("open");}
function toggleDark(){
  var on=document.getElementById("darkToggle").checked;
  document.documentElement.setAttribute("data-theme",on?"dark":"light");
  localStorage.setItem("theme",on?"dark":"light");
}
(function(){if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark");})();

function closeModal(id){document.getElementById(id).classList.remove("open");}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("show");document.getElementById("backdrop").classList.toggle("show");}
document.querySelectorAll(".overlay").forEach(function(o){o.addEventListener("click",function(e){if(e.target===o)o.classList.remove("open");});});

render();
</script>
</body>
</html>
