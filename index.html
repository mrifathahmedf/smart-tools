:root{--bg:#0e1020;--panel:#171a2e;--card:#1c2038;--text:#eef1ff;--muted:#9aa3c7;--brand1:#7c3aed;--brand2:#ec4899;--brand3:#06b6d4;--line:#2a2f4d;--ok:#22c55e}
[data-theme=light]{--bg:#f4f6fb;--panel:#fff;--card:#fff;--text:#1f2540;--muted:#6b7390;--line:#e6e9f5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);transition:.3s}
a{color:inherit;text-decoration:none}
.app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;position:fixed;top:0;left:0;bottom:0;overflow:auto;transition:.3s;z-index:40}
.sidebar.hide{transform:translateX(-260px)}
.brand-sm{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--brand1),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:16px;padding:8px;cursor:pointer;border-radius:12px;transition:.2s;display:flex;align-items:center;gap:6px}
.brand-sm:hover{background:var(--card);-webkit-text-fill-color:initial;color:var(--brand2)}
.catbtn{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:none;background:transparent;color:var(--text);border-radius:12px;cursor:pointer;font-size:15px;text-align:left;margin-bottom:6px}
.catbtn:hover{background:var(--card)}
.catbtn.active{background:linear-gradient(90deg,var(--brand1),var(--brand2));color:#fff}
.catbtn .del{margin-left:auto;opacity:.5;font-size:13px}
.catbtn .del:hover{opacity:1}
.newcat{display:flex;align-items:center;gap:8px;width:100%;padding:12px 14px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:12px;cursor:pointer;font-size:14px;margin-top:10px}
.newcat:hover{border-color:var(--brand1);color:var(--brand2)}
.main{flex:1;margin-left:240px;padding:20px;transition:.3s}
.main.full{margin-left:0}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.icon-btn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:20px;cursor:pointer}
.title{font-size:34px;font-weight:800;background:linear-gradient(90deg,var(--brand1),var(--brand2),var(--brand3));-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:var(--muted);font-size:15px}
.btn{border:none;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:600;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--brand1),var(--brand2))}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.subtabs{display:flex;gap:8px;overflow-x:auto;padding:6px 0;margin:10px 0}
.subtab{white-space:nowrap;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer;font-size:14px;font-weight:600}

.search{width:100%;padding:14px 18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;margin:8px 0 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(124,58,237,.25)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--brand1),var(--brand2),var(--brand3))}
.card h3{font-size:18px;margin-bottom:6px}
.card p{color:var(--muted);font-size:14px;min-height:38px}
.card .open{color:var(--brand2);font-weight:600;font-size:14px;display:inline-block;margin-top:10px}
.badge{position:absolute;top:14px;right:14px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;color:#fff}
.bd-custom{background:#f59e0b}.bd-ai{background:#7c3aed}.bd-net{background:#06b6d4}.bd-dev{background:#22c55e}
.rowbtns{display:flex;gap:8px;margin-top:10px}
.mini{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--text);cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.loadwrap{text-align:center;margin:26px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;padding:30px 14px;z-index:60;overflow:auto}
.modal.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:560px}
.sheet h2{margin-bottom:14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-family:inherit}
.field textarea{min-height:80px;resize:vertical}
.modecards{display:grid;gap:10px}
.modecard{border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;background:var(--card)}

.modecard b{font-size:15px}.modecard span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.premium{font-size:10px;background:linear-gradient(90deg,#f59e0b,#ec4899);color:#fff;padding:2px 8px;border-radius:999px;margin-left:6px}
.keylink{color:var(--brand3);font-size:13px;font-weight:600}
.jump{position:fixed;right:14px;bottom:18px;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
.jump.show{opacity:1;pointer-events:auto}
.jbtn{background:rgba(0,0,0,.18);color:var(--text);border:none;width:30px;height:30px;border-radius:50%;font-size:13px;line-height:1;cursor:pointer;opacity:.55;padding:0;display:flex;align-items:center;justify-content:center}

.hr{height:1px;background:var(--line);margin:16px 0}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.ptype{font-size:11px;padding:2px 8px;border-radius:999px;margin-left:6px;font-weight:700}
.t-free{background:#22c55e;color:#fff}.t-paid{background:#ef4444;color:#fff}.t-trial{background:#f59e0b;color:#fff}
.hero{text-align:center;padding:54px 16px 30px}

.story{max-width:820px;margin:10px auto 40px}
.story .para{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--brand2);border-radius:16px;padding:22px 24px;margin:18px 0;opacity:0;transform:translateY(40px);transition:opacity .7s,transform .7s,box-shadow .3s,border-color .3s}
.story .para.in{opacity:1;transform:none}

.story .para h3{font-size:19px;margin-bottom:8px;background:linear-gradient(90deg,var(--brand1),var(--brand2));-webkit-background-clip:text;background-clip:text;color:transparent}

.sidesearch{width:100%;padding:10px 13px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;margin-bottom:12px}
.foryou{display:flex;align-items:center;gap:10px;width:100%;padding:13px 14px;border:none;border-radius:12px;cursor:pointer;font-size:15px;font-weight:700;text-align:left;margin-bottom:10px;color:#fff;background:linear-gradient(90deg,#f59e0b,#ec4899,#7c3aed);background-size:200% 200%;animation:fyglow 5s ease infinite}

.foryou.active{outline:3px solid rgba(255,255,255,.3)}
.fysec{margin:24px 0}

.fav-star{position:absolute;top:12px;left:12px;font-size:18px;cursor:pointer;background:none;border:none;z-index:2;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}

.jbtn:hover{opacity:1}
