Settings();}function saveAiKey(){st.aiKeys[st.aiProv]=document.getElementById('aiKeyIn').value.trim();S('st_aiKeys',st.aiKeys);alert('✅ AI key সেভ হয়েছে');}function removeAiKey(){delete st.aiKeys[st.aiProv];S('st_aiKeys',st.aiKeys);renderSettings();}function saveMemo(){st.memo=document.getElementById('memoIn').value.trim();S('st_memo',st.memo);alert('✅ মেমোরি সেভ হয়েছে');}function clearMemo(){st.memo='';S('st_memo','');renderSettings();}function saveNetKey(){st.netKeys[st.netProv]=document.getElementById('netKeyIn').value.trim();S('st_netKeys',st.netKeys);alert('✅ Internet key সেভ হয়েছে');}function removeNetKey(){delete st.netKeys[st.netProv];S('st_netKeys',st.netKeys);renderSettings();}function loadMore(){if(st.view=='net')return netSearch();if(st.view=='ai')return aiSearch();}function setBtn(t){var b=document.getElementById('loadbtn');if(b){b.innerText=t;b.disabled=true;}}function resetBtn(){render();}function excludeList(){var keys=allKeys(st.cat);var names=[];Object.keys(keys).forEach(function(k){if(k.indexOf('n:')==0)names.push(k.slice(2));});return names;}function memoLine(){return st.memo?(' Extra user rules: '+st.memo):'';}function netSearch(){if(st.mode!='net'){alert('⚙️ সেটিংসে আগে "🌐 Searching Tools Internet" মোড চালু করুন।');return;}var prov=st.netProv;var key=st.netKeys[prov];if(!key){alert('⚙️ সেটিংসে '+prov+' API key দিন।');openSettings();return;}if(prov!='serper'){alert('এই বিল্ডে সরাসরি সার্চ শুধু Serper-এ সক্রিয়। অন্যগুলোর key সেভ থাকবে।');return;}setBtn('🔎 খুঁজছি...');var q=curCatName()+' online tools list';fetch('https://google.serper.dev/search',{method:'POST',headers:{'X-API-KEY':key,'Content-Type':'application/json'},body:JSON.stringify({q:q,num:15})}).then(function(r){return r.json();}).then(function(d){var items=(d.organic||[]).map(function(o){return {name:o.title,desc:o.snippet||'',url:o.link};});var n=addTools('net',st.cat,items);alert(n>0?'✅ '+n+'টি নতুন টুল যোগ হয়েছে':'নতুন কিছু পাওয়া যায়নি (সব ডুপ্লিকেট ছিল)');resetBtn();}).catch
